version: '3.8'

services:
  # 1. API Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-app
      - campaign-app
      - transaction-app
      - admin-app
    networks:
      - sodakoh_network

  # 2. User Service
  user-app:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-app
    restart: unless-stopped
    volumes:
      - ./user-service:/var/www/html
    env_file:
      - ./user-service/.env
    networks:
      - sodakoh_network
    depends_on:
      - user-db

  user-db:
    image: mariadb:10.6
    container_name: user-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_user
    volumes:
      - user_db_data:/var/lib/mysql
      - ./config/sodakoh_pohon.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sodakoh_network

  # 3. Campaign Service
  campaign-app:
    build:
      context: ./campaign-service
      dockerfile: Dockerfile
    container_name: campaign-app
    restart: unless-stopped
    volumes:
      - ./campaign-service:/var/www/html
    env_file:
      - ./campaign-service/.env
    networks:
      - sodakoh_network
    depends_on:
      - campaign-db

  campaign-db:
    image: mariadb:10.6
    container_name: campaign-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_campaign
    volumes:
      - campaign_db_data:/var/lib/mysql
      - ./config/sodakoh_pohon.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sodakoh_network

  # 4. Transaction Service
  transaction-app:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-app
    restart: unless-stopped
    volumes:
      - ./transaction-service:/var/www/html
    env_file:
      - ./transaction-service/.env
    networks:
      - sodakoh_network
    depends_on:
      - transaction-db

  transaction-db:
    image: mariadb:10.6
    container_name: transaction-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_transaction
    volumes:
      - transaction_db_data:/var/lib/mysql
      - ./config/sodakoh_pohon.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sodakoh_network

  # 5. Admin Service
  admin-app:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: admin-app
    restart: unless-stopped
    volumes:
      - ./admin-service:/var/www/html
      - ./campaign-service/uploads:/var/www/html/uploads
    env_file:
      - ./admin-service/.env
    networks:
      - sodakoh_network
    depends_on:
      - user-db
      - campaign-db
      - transaction-db

networks:
  sodakoh_network:
    driver: bridge

volumes:
  user_db_data:
  campaign_db_data:
  transaction_db_data:
