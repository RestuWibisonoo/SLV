version: '3.8'

services:
  # 1. Nginx Reverse Proxy / Web Server
  webserver:
    image: nginx:alpine
    container_name: sodakoh_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - sodakoh_network

  # 2. PHP-FPM Application Environment
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sodakoh_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    networks:
      - sodakoh_network

  # 3. Database Server
  db:
    image: mariadb:10.6
    container_name: sodakoh_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment the line below to auto-import SQL file on first run if needed
      # - ./config/sodakoh_pohon.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sodakoh_network

networks:
  sodakoh_network:
    driver: bridge

volumes:
  db_data:
