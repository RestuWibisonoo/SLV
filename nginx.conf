server {
    listen 80;
    server_name localhost;

    # User Service
    location /api/user/ {
        proxy_pass http://user-app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Campaign Service
    location /api/campaign/ {
        proxy_pass http://campaign-app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Transaction Service
    location /api/transaction/ {
        proxy_pass http://transaction-app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Service
    location /api/admin/ {
        proxy_pass http://admin-app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway Root
    location / {
        default_type application/json;
        return 200 '{
            "success": true,
            "message": "SLV API Gateway Online",
            "base_url": "https://apislv.restuw.my.id",
            "services": {
                "user": {
                    "status": "online",
                    "endpoints": [
                        "GET /api/user/",
                        "GET /api/user/health",
                        "POST /api/user/login",
                        "POST /api/user/register"
                    ]
                },
                "campaign": {
                    "status": "online",
                    "endpoints": [
                        "GET /api/campaign/list",
                        "GET /api/campaign/{id}",
                        "GET /api/campaign/stats",
                        "GET /api/campaign/submissions",
                        "POST /api/campaign/submissions"
                    ]
                },
                "transaction": {
                    "status": "online",
                    "endpoints": [
                        "GET /api/transaction/cart",
                        "POST /api/transaction/cart",
                        "DELETE /api/transaction/cart",
                        "GET /api/transaction/donations",
                        "GET /api/transaction/donations/{id}",
                        "POST /api/transaction/checkout",
                        "POST /api/transaction/confirm-payment"
                    ]
                },
                "admin": {
                    "status": "online",
                    "endpoints": [
                        "GET /api/admin/",
                        "POST /api/admin/login",
                        "GET /api/admin/dashboard",
                        "GET /api/admin/campaigns",
                        "GET /api/admin/campaigns/{id}",
                        "POST /api/admin/campaigns",
                        "POST /api/admin/campaigns/{id}",
                        "DELETE /api/admin/campaigns/{id}",
                        "GET /api/admin/donations",
                        "PUT /api/admin/donations/{id}",
                        "GET /api/admin/submissions",
                        "PUT /api/admin/submissions/{id}",
                        "GET /api/admin/plantings",
                        "GET /api/admin/plantings/{id}",
                        "POST /api/admin/plantings",
                        "POST /api/admin/plantings/{id}",
                        "DELETE /api/admin/plantings/{id}",
                        "PUT /api/admin/profile"
                    ]
                }
            }
        }';
    }
}
